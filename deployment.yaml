apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-management   
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-management
  template:
    metadata:
      labels:
        app: inventory-management
    spec:
      containers:
      - name: inventory-management     
        image: 23mis0679/inventory-management:latest
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: inventory-management-service     
spec:
  type: NodePort
  selector:
    app: inventory-management
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30010       